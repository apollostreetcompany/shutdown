name: Site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --check public/browser-analytics.js
      - run: npm run validate
      - run: npm run build
      - run: node scripts/validate-sitemap.mjs
